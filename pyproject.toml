[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-ai-software-kit"
version = "2.0.0"
description = "Infraestructura portable de ingeniería asistida por IA"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = {file = "LICENSE"}

[project.scripts]
uasek = "uasek.cli:main"

[tool.setuptools]
packages = ["uasek", "uasek.eip"]
include-package-data = true
