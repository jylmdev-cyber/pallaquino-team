name: Documentation CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DOCS_BASE: ${{ vars.DOCS_BASE }}
      DOCS_ORIGIN: ${{ vars.DOCS_ORIGIN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: documentation/portal/package-lock.json
      - run: npm ci --ignore-scripts --no-fund --no-audit
        working-directory: documentation/portal
      - run: npm audit --audit-level=high
        working-directory: documentation/portal
      - run: python -m unittest discover -s tests -p test_documentation.py -v
      - run: python tools/docs_manager.py generate
      - run: python tools/docs_manager.py validate
      - run: python tools/docs_manager.py build
